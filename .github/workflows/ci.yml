name: ci

# No secrets are needed and none may be added: every test runs offline, and the
# repo must stay publishable. If a job ever needs an Instagram session, it is the
# wrong job.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # secret scan needs history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: tests
        run: pytest tests -q -p no:warnings
      - name: lint
        run: ruff check src tests scripts

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: npm test
        working-directory: web

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: no credential files tracked
        run: |
          if git ls-files | grep -viE '\.env\.example$' | grep -iE 'cookies|session|secret|credential'; then
            echo "::error::a credential-looking file is tracked"; exit 1
          fi
      - name: no sessionid / api key values in history
        run: |
          if git grep -nE '[0-9]{6,}%3A[A-Za-z0-9_-]{10,}|sk-ant-[A-Za-z0-9-]{20,}' $(git rev-list --all) -- 2>/dev/null | head -5 | grep .; then
            echo "::error::a credential-shaped value exists in git history"; exit 1
          fi
      - name: no personal collection names
        run: python scripts/scrub-personal.py --check
