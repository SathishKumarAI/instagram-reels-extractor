# Curated vision models for the bench. Each entry earns its place by the contrast
# it tests — see docs/research/README.md. Install with `reels-scrap models pull <name>`.
#
# vram_gb is what the weights take; add ~2GB for a 32k KV cache. The box is a
# 16.3GB RTX 5070 Ti and runs ONE model at a time.
models:
  reels-vision:
    tag: qwen2.5vl:7b-q8_0
    build: reels-vision          # already built from scripts/ollama-vision.Modelfile
    num_ctx: 32768
    vram_gb: 9.4
    role: control
    notes: >-
      The model that wrote every existing local record. It is the baseline every
      other arm is measured against, so it is never rebuilt or replaced.

  qwen3vl-8b:
    tag: qwen3-vl:8b
    num_ctx: 32768
    vram_gb: 8.0
    role: same family, one generation newer
    notes: >-
      Isolates generation: same family and size class as the control, newer
      training. If the 2025->2026 jump closes the gap to Claude, this shows it.

  qwen3vl-4b:
    tag: qwen3-vl:4b
    num_ctx: 32768
    vram_gb: 4.0
    role: size ladder rung
    notes: Halves parameters with family and generation held constant.

  qwen3vl-2b:
    tag: qwen3-vl:2b
    num_ctx: 32768
    vram_gb: 2.5
    role: size ladder floor
    notes: >-
      Where the ladder breaks. A 7B already reads "3-8 facts" as "3"; this finds
      what a 2B does with the same instruction.

  minicpm-v45:
    tag: minicpm-v4.5:8b
    num_ctx: 32768
    vram_gb: 6.0
    role: different family, OCR-strong
    notes: >-
      Our reels are text-heavy screenshots. This family is built for reading
      on-screen text, so it tests whether OCR strength — not size — is the gap.

  gemma4-12b:
    tag: gemma4:12b
    num_ctx: 32768
    vram_gb: 9.0
    role: largest with headroom
    notes: The biggest model that still leaves room for a 32k KV cache on 16GB.

  deepseek-ocr:
    tag: deepseek-ocr:3b
    num_ctx: 32768
    vram_gb: 3.0
    role: specialist control
    notes: >-
      An OCR specialist rather than a generalist VLM. Expected to win on
      on-screen text and lose on summarising — which is exactly the contrast.
