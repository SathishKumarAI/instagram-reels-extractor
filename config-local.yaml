# LOCAL-GPU mode: vision runs on YOUR OWN GPU box via an OpenAI-compatible
# endpoint (vLLM/Ollama serving open-weights Kimi-VL). Frames never leave your
# LAN — no egress. Same genre/summary/tags/facts/tokens output as the Claude
# path. On failure it falls back to claude-cli (set vision_local_fallback:false
# for strict local-only). See docs/LOCAL-VISION.md for serving setup.
#
# Switch anytime:  reels-scrap sync -c config-local.yaml
#            or:   reels-scrap sync --backend local     (with base_url set in any config)
source:
  type: urls
  urls_file: reels-phd.txt
  target: ""
  login: false
  username: ""
  limit: 200
  resume: true

auth:
  cookies_from_browser: "chrome"
  cookies_file: "cookies.txt"
  browser_profile: ""

extract:
  caption: true
  transcript: false
  ocr: false
  vision: true
  vision_backend: local          # <-- the switch: use the local GPU endpoint
  vision_local:
    base_url: "http://gpu-box:8000/v1"   # <-- EDIT to your box (vLLM/Ollama /v1)
    model: "moonshotai/Kimi-VL-A3B-Instruct"
    api_key: ""
    timeout: 120
  vision_local_fallback: false   # STRICT LOCAL — never egress to Claude. Failed reels dead-letter; retry with `sync --retry-failed`
  whisper_model: base
  whisper_device: auto
  whisper_language: ""
  whisper_translate: true
  vision_model: claude-sonnet-4-6   # used only for the fallback path
  frame_every_sec: 2
  max_frames: 4
  frame_max_width: 512
  vision_concurrency: 1          # raise for a GPU box that handles parallel requests
  vision_max_retries: 3
  vision_retry_backoff: 5.0

batch:
  workers: 4

output:
  pdf: false
  docs_site: false
  combined_pdf: false

paths:
  data_dir: data
  output_dir: output
